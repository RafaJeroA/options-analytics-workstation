[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "options-analytics-workstation-backend"
version = "0.1.0"
description = "Local-first options research and scenario-analysis API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.2",
  "uvicorn[standard]==0.42.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "pytest==9.0.2",
  "ruff==0.16.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "ibkr_live: opt-in read-only checks requiring a local TWS or IB Gateway session",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
