name: Frontend

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check tracked artifacts and secrets
        working-directory: .
        run: python scripts/check_repository_hygiene.py --tracked
      - name: Clean install
        run: npm ci
      - name: Install mock API test dependencies
        working-directory: .
        run: python -m pip install -e "backend"
      - name: Verify frontend mock workflow excludes external IBKR client
        working-directory: .
        run: python -c "import importlib.util; assert importlib.util.find_spec('ibapi') is None"
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Deterministic analytics visual workflow
        run: npm run test:visual
